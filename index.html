<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>MINH IOS - Kích hoạt</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,Inter,sans-serif}
body{background:#080a12;color:#fff;min-height:100vh;padding:0 16px 30px}
.top{text-align:center;padding:28px 0 10px}
.top h1{font-size:38px;font-weight:900;letter-spacing:1px}
.top h1 .w{color:#fff}.top h1 .b{color:#3b82f6}
.top p{color:#7c8299;font-size:13px;margin-top:6px;font-weight:600;letter-spacing:0.3px}
.card{background:#121624;border:1px solid #1e253a;border-radius:20px;padding:16px 16px;margin-top:18px}
.row{display:flex;gap:10px;margin:11px 0}
.circle{min-width:26px;height:26px;background:#1c233a;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#8b93b3}
.row p{font-size:13.5px;color:#9aa1b8;line-height:1.4}
.row b{color:#f9d76b;font-weight:800}
.label{font-size:11px;color:#7c8299;letter-spacing:1px;font-weight:800;margin-bottom:8px;margin-top:14px}
.input-wrap{display:flex;align-items:center;background:#080a12;border:1px solid #1e253a;border-radius:14px;padding:6px 6px 6px 14px}
.input-wrap input{flex:1;background:transparent;border:none;outline:none;color:#8a8f9f;font-size:14px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase}
.input-wrap button{background:#1e253a;border:none;color:#cbd2e3;padding:10px 18px;border-radius:10px;font-weight:800;font-size:13px}
.btn-blue{width:100%;margin-top:18px;background:#2f6bff;color:#fff;border:none;padding:16px;border-radius:16px;font-size:16px;font-weight:900;letter-spacing:0.5px;box-shadow:0 8px 25px rgba(47,107,255,0.45)}
.note{background:#121624;border:1px solid #1e253a;border-radius:16px;padding:14px;margin-top:16px;color:#8b93b3;font-size:12.5px;line-height:1.6}
.note b{color:#f9d76b}
.foot{text-align:center;color:#3a415c;font-size:12px;margin-top:24px}
#msg{text-align:center;margin-top:12px;font-weight:800;font-size:13px;display:none}
</style>
</head>
<body>
<div class="top">
<h1><span class="w">MINH</span><span class="b">IOS</span></h1>
<p>Kích hoạt bản quyền — dán MÃ MÁY + KEY</p>
</div>

<div class="card">
<div class="row"><div class="circle">1</div><p>Mở game → bấm icon <b>M</b> góc trên trái → tab <b>KEY</b>.</p></div>
<div class="row"><div class="circle">2</div><p>Bấm <b>COPY MÃ MÁY</b> rồi <b>DÁN</b> vào ô MÃ MÁY bên dưới.</p></div>
<div class="row"><div class="circle">3</div><p>Dán <b>KEY</b> đã mua → bấm <b>KÍCH HOẠT</b>.</p></div>
<div class="row"><div class="circle">4</div><p>Xong! Mở lại game là dùng được (không cần làm gì thêm).</p></div>
</div>

<div class="card">
<div class="label">MÃ MÁY
